# =============================================================================
# RAG Pipeline Yapılandırması — Agent-Orchestrated Multi-Block Deployment
# =============================================================================
#
# Bu dosya şunları tanımlar:
#   1. deployment_blocks: LLM inference makineleri (fast, answer, expert)
#   2. agent: planning agent, answering agent, sanitizer agent yapılandırması
#   3. retrieval: reranker ve context oluşturma parametreleri
#
# Model özellikleri ve collection kaydı models.yaml dosyasındadır (tamamen veri güdümlü).
#
# Geçersiz kılma: --pipeline path/to/custom.yaml
# Fallback: Bu dosya yoksa settings.py + collections.py kullanılır.
# =============================================================================

# ---------------------------------------------------------------------------
# Deployment Blocks — her block, Ollama çalıştıran ayrı bir makine/servistir
# ---------------------------------------------------------------------------
deployment_blocks:
  fast-01:
    host: http://localhost:11434
    purpose: "planning,filter_extraction,sanitization,judge"
    models:
      planner: gemma4:e2b
      filter_extractor: gemma4:e2b
      sanitizer: qwen3.5:9b
      judge: gemma4:e2b        # judge LLM (borderline-only) — gemma4 warm ~1.5s; planner/classifier ile aynı resident model
      classifier: gemma4:e2b   # warm ~1.2s (qwen verbose ~7.8s). planner ile aynı modeli paylaşır → classify→plan ek yükleme yok
      suggester: qwen3.5:9b
    timeout_seconds: 60
    retries: 1

  gpu-01:
    host: http://localhost:11434
    purpose: "answering"
    models:
      answer: gemma3:12b        # 12B Gemma; kapasite/hız dengesi (31b'den belirgin hızlı)
    timeout_seconds: 90
    max_num_ctx: 32768
    max_num_predict: 4096

  gpu-02:
    host: http://localhost:11434
    purpose: "expert"
    models:
      expert: qwen3.5:9b
    timeout_seconds: 120
    max_num_ctx: 65536
    max_num_predict: 16384

# ---------------------------------------------------------------------------
# Agent Configuration
# ---------------------------------------------------------------------------
agent:
  # Her aşamanın LLM gerekçesini/çıktısını (thinking + reasoning) trace detaylarına
  # ekler → UI'da aşama-bazlı görünür. Kapatınca trace daha yalın/hafif olur.
  expose_thinking: true

  bad_words_filter:
    enabled: false   # stage-2: birleşik orchestrator'da sonradan açılacak
    response_message: |
      Lütfen saygılı dil kullanın. Sorgunuzda uygun olmayan kelime tespit edildi.
    bad_words:
      - "aptal"
      - "salak"
      - "piç"
      - "küfür"
      - "amcık"
      - "orospu"
      - "şerefsiz"
    bad_word_patterns:
      - "en ağır küfür(ler)?"
      - "bana küfür et"

  classifier:
    enabled: true
    block: fast-01
    model_key: classifier
    temperature: 0.0
    confidence_threshold: 0.6
    think: false
    prompt: |
      Sen bir RAG sistemi kapı bekçisi ve niyet analistisin. Kullanıcı sorgusunu
      sınıflandır hem de hangi koleksiyon(lar)da aranması gerektiğini belirle.

      Mevcut koleksiyonlar:
      {catalog}

      Sistem yalnızca şu konuları bilir:
      - Türk gazete arşivi kupürleri (1970-2010 dönemi siyaset, ekonomi, toplum)
      - TBMM tutanakları (1980-günümüz milletvekili konuşmaları, oturumlar)
      - TBMM önergeleri ve kanun teklifleri

      Sınıflar (scopes):
      1. "in_scope": Koleksiyonlarda arama (retrieval) yapılmasını gerektiren tarihi ve siyasi sorular.
      2. "conversational": Selamlaşma, teşekkür, sohbeti sonlandırma ya da doğrudan önceki konuşma geçmişine (sohbet hafızasına/metinlere) atıfta bulunan sorular.
      3. "off_domain": Tarihi arşiv ve meclis konuları dışındaki, geçmişe de atıfta bulunmayan tamamen alan dışı sorular (kod yazma, hava durumu, vb.).

      In_scope örnekleri:
      - "Özal döneminde gazete manşetleri"
      - "1997 TBMM bütçe görüşmeleri"
      - "Kanun teklifi 2/1234 hakkında ne tartışıldı"
      - "Doğan Avcıoğlu köşe yazıları"
      - "Atatürk'ün vefatı"
      - "Susurluk skandalı"

      Conversational örnekleri:
      - "merhaba", "selam", "nasılsın"
      - "sana ne sordum az önce", "az önceki sorum neydi"
      - "son cevabı özetle", "az önce neyden bahsettin"
      - "teşekkürler", "sağ ol", "yardımcı oldun"
      - "kimin hakkında konuşuyorduk"

      Off_domain örnekleri:
      - "hava bugün nasıl"
      - "Einstein kimdir"
      - "Python kodu yaz"
      - "2026 dolar kuru"

      ÖNEMLİ — Türk siyasi/tarihsel olaylar, kişiler, devrimler, savaşlar, darbeler,
      bürokratlar, gazeteciler ve milletvekilleri her zaman in_scope sayılır.
      Eğer soru selamlaşma, teşekkür veya sohbet geçmişine atıf içeriyorsa conversational seçilmelidir.
      Yalnızca kesinlikle alan dışı ve geçmişe atıfta bulunmayan sorular off_domain'dir.

      Koleksiyon seçimi (tool/db seçimi - sadece in_scope için):
      - Gazete/basın/köşe yazısı/manşet/muhabir → doc_type=gazete koleksiyonları
      - Meclis/oturum/birleşim/milletvekili/konuşma/tutanak → doc_type=tutanak koleksiyonları
      - Kanun teklifi/önerge/yasa taslağı → doc_type=onerge koleksiyonları
      - Konu hangi türü ima ediyorsa o türden en az bir koleksiyon seç; emin değilsen
        selected_collections'ı boş bırak (planner tüm katalogdan seçer). Conversational veya off_domain ise selected_collections boş bırakılmalıdır.

      JSON çıktısı:
      {"scope": "in_scope" veya "off_domain" veya "conversational", "confidence": 0.0-1.0,
       "selected_collections": ["koleksiyon_adi", ...], "reason": "kısa gerekçe"}

  suggester:
    block: fast-01
    model_key: suggester
    temperature: 0.3
    think: false
    suggestion_count: 3
    prompt: |
      Sen bir RAG sistemi öneri uzmanısın. Kullanıcının alan dışı sorgusu var.
      Sistemin bildiği koleksiyonlardan yararlanarak 3 alternatif in-domain sorgu öner.

      Mevcut koleksiyonlar:
      {catalog}

      Kurallar:
      1. Tam 3 öneri üret
      2. Her öneri kısa, Türkçe, doğrudan sorulabilir bir soru olsun
      3. Mümkünse kullanıcının orijinal sorgu temasıyla bağ kur
         (ör. "Einstein kimdir" → "Türk basınında bilim insanı haberleri")
      4. Bağ kurulamıyorsa koleksiyonlardan örnekleyici 3 farklı tema seç

      JSON çıktısı:
      {{"suggestions": ["soru1", "soru2", "soru3"]}}

  # Belirsiz/geniş sorgu deneyimi — ana retrieval sonuçlarından facet çıkar →
  # belirsizse sorguyu DARALTMADAN geniş yanıtla + facet-temelli "rabbit hole"
  # önerileri üret. (Eski davranış: en sık yılı sert tarih filtresi olarak basıyordu
  # ve bunun için ayrı bir probe turu çalıştırıyordu — ikisi de kaldırıldı.)
  clarification:
    enabled: true
    suggestion_count: 3          # üretilecek facet-temelli drill-down öneri sayısı
    ambiguity:
      min_distinct_years: 3      # >= bu kadar farklı yıl → belirsiz
      dominance_ratio: 0.6       # en baskın facet oranı < bu → belirsiz
      vague_query_clarify: true  # yıl/özne içermeyen genel "X hakkında bilgi" sorgularında da öner
      # vague_markers: [...]     # (ops.) varsayılan Türkçe genel-sorgu işaretçilerini ezmek için
    # DEPRECATED — aşağıdakiler artık kullanılmıyor: probe_k (ayrı probe turu kalktı),
    #   question_count, max_turns_normal, max_turns_deep, block, model_key,
    #   temperature, think, prompt. Geriye dönük güvenli; loader hâlâ okuyabilir.

  off_domain_response_template: |
    Bu sistem yalnızca gazete arşivi ve TBMM tutanakları sorgular için tasarlandı.
    Sorunuz bu kapsam dışında görünüyor.

    Belki şunu sormak istediniz:
    1. {suggestion_0}
    2. {suggestion_1}
    3. {suggestion_2}

  off_domain_fallback_suggestions:
    - "Özal döneminde gazete manşetleri"
    - "1997 TBMM bütçe görüşmeleri"
    - "Susurluk skandalı haberleri"

  # Planning Agent — kullanıcı sorgusunu alır, kaynakları belirler, arama taslakları üretir
  planner:
    block: fast-01
    model_key: planner
    think: false
    default_query_count: 2
    normal_max_query_variants: 5   # normal modda sorgu çeşitlendirme tavanı (paralel + RRF)
    search_strategy: "auto"  # agent, her collection için parallel mı sequential mı olacağına karar verir

    plan_prompt: |
      Sen bir RAG araştırma planlama uzmanısın. Kullanıcı sorgusunu analiz et ve
      arama planı oluştur.

      Kurallar:
      1. Önce sorgunun amacını belirle: factual (basit bilgi), comparative (karşılaştırma),
         analytical (derin analiz), temporal (zaman bazlı), unknown
      2. Hangi koleksiyonların ilgili olduğunu belirle
      3. Her koleksiyon için 2 alternatif arama sorgusu üret (farklı kelime seçimleri)
      4. Filtreleri çıkar (yıl, yazar, kaynak, dönem, birleşim)
      5. Arama stratejisini seç: parallel (hızlı) veya sequential (önceki sonuçlar
         sonraki aramayı etkilesin)
      6. Kısa bir gerekçe yaz

      JSON çıktısı:
      {
        "intent": "factual|comparative|analytical|temporal|unknown",
        "resources": [
          {
            "collection": "koleksiyon_adi",
            "mode": "parallel|sequential",
            "priority": 1,
            "query_drafts": [
              {"text": "arama_sorgusu", "filters": {"year": 1997, "author": null}, "top_k": 10}
            ]
          }
        ],
        "reasoning": "neden bu plan"
      }

    # Re-retrieval: sonuçlar yetersizse otomatik olarak tetiklenir
    re_retrieval:
      enabled: true
      max_retries: 1
      trigger_min_results: 3
      strategy: "broaden_filters"  # yazar filtresi kaldır → yıl filtresi kaldır → yalnızca semantic
      prompt: |
        Önceki arama yetersiz sonuç döndürdü. Filtreleri gevşeterek yeni arama
        sorguları üret. Daha geniş tarih aralığı, yazar filtresi kaldır, alternatif
        kelimeler kullan.
      on_quality_failure: true  # yanıt sorguyu karşılamadığında yeniden arama yap

    # Planning tamamen başarısız olduğunda devreye giren fallback.
    # Her doc_type için bir collection'a broadcast yapar; planner çökse bile
    # gazete/tutanak/onerge sorguları uygun index'e ulaşmaya devam eder.
    fallback:
      strategy: "broadcast"
      default_collections:
        - tutanaklar_ctx1024
      default_queries:
        - text: "{original_query}"
          filters: null
          top_k: 10

  # Answering Agent — retrieve edilen context'ten nihai yanıtı üretir
  answering:
    block: gpu-01
    model_key: answer
    think: false
    temperature: 0.3
    num_ctx: 32768
    num_predict: 4096

  # Sanitizer Agent — çıktı kalitesini doğrular, hataları düzeltir veya işaretler
  sanitizer:
    block: fast-01
    model_key: sanitizer
    think: false
    temperature: 0.0
    max_chars: 2000
    validation_criteria:
      - "Cevap kullanıcının orijinal sorusunu yanıtlıyor mu?"
      - "İddialar kaynaklarla destekleniyor mu?"
      - "Uydurma bilgi var mı?"
      - "Yanıt Türkçe mi?"
    max_retries: 1
    retry_prompt: "Cevap yetersiz veya hatalı. Kaynaklara dayanarak yeniden üret."

  # Filter Extractor — doğal dil sorgularından yapısal filtreleri çıkarır
  filter_extractor:
    block: fast-01
    model_key: filter_extractor
    temperature: 0.0

# ---------------------------------------------------------------------------
# Retrieval Parametreleri
# ---------------------------------------------------------------------------
retrieval:
  reranker:
    enabled: true
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
    fetch_k: 100
    coarse_k: 20
    final_k: 5

  context:
    max_chars: 4000
    total_max_chars: 12000
    distance_threshold: 1.8
    window_size: 800
    window_max_total: 3000

# ---------------------------------------------------------------------------
# Orchestrator — yeni agentic pipeline (planner → policy → allocator →
# retrieve → assembler → judge → expander → answer → sanitizer → citations)
# ---------------------------------------------------------------------------
orchestrator:
  enabled: true        # DEPRECATED — tek yol artık OrchestratorAgent; bayrak dispatch'i kaldırıldı

policy:
  enabled: false       # stage-2: kapalıyken allowed = planner-önerisi koleksiyonlar
  mode: session_intersection   # session-seçimi ∩ planner-önerisi
  # auth_rules: ileride eklenecek; tüm koleksiyonlar şu an public

allocation:
  enabled: false       # stage-2: kapalıyken düz fetch_k tek havuz (reserve yok)
  defaults:    { primary: 2, reserve: 2, fetch_k: 15 }
  by_query_type:
    fact:       { primary: 2, reserve: 2, fetch_k: 15 }
    summary:    { primary: 3, reserve: 2, fetch_k: 15 }
    comparison: { primary: 3, reserve: 2, fetch_k: 15 }
    reasoning:  { primary: 3, reserve: 2, fetch_k: 15 }
    policy:     { primary: 3, reserve: 3, fetch_k: 18 }
  max_per_document: 3    # belge başına 3 chunk (1 idi → tek belgeden de zengin bağlam)
  max_total_primary: 15  # bağlama girecek toplam chunk tavanı (12 idi)

judge:
  mode: hybrid
  heuristic:
    # Gevşek: bilgilendirici veri kalsın, yalnızca çok alakasız chunk elensin.
    min_chunks: 2
    min_collection_coverage: 1
    min_rerank_score: 0.02     # bu eşiğin altındaki chunk'lar answer'dan önce düşürülür
  llm:
    enabled: true
    block: fast-01
    model_key: judge
    borderline_band: [1, 2]
    max_borderline_score_floor: 0.35
    timeout_seconds: 5
  max_expand_iterations: 1
  on_low_confidence: expand
  expand:
    strategy: requery   # requery: yeni çeşitlendirilmiş retrieve / reserve: eski reserve-promote
