# Langfuse v3 self-host — RAM-limitli, paylaşımlı sunucu için ayarlı.
#
# - Web (3100) LAN'a açık (remote erişim için); MinIO S3 (127.0.0.1:9090)
#   yalnız loopback'te kalır. Postgres/ClickHouse/Redis compose ağının içinde kalır.
# - Her serviste mem_limit + memswap_limit: toplam tavan ~5.75 GiB,
#   tipik kullanım ~2.5-3.5 GiB. OOM'da konteyner ölür ve restart policy
#   ile kalkar — Ollama/vLLM süreçleri asla etkilenmez.
# - Yoğun ingestion kampanyalarında: `docker compose stop` (SDK sessizce
#   düşer, pipeline yavaşlamaz).
# - Gizli değerler ./\.env'den gelir (commit edilmez, şablonu .env.example).
# - İlk açılışta LANGFUSE_INIT_* headless bootstrap org/proje/kullanıcı ve
#   API anahtarlarını oluşturur; sonraki açılışlarda idempotenttir.
name: langfuse
services:
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3100:3000"
    mem_limit: 1536m
    memswap_limit: 1536m
    environment: &langfuse-env
      NODE_OPTIONS: "--max-old-space-size=1024"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: http://10.20.24.13:3100
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      # --- headless bootstrap (yalnız ilk açılışta etkili) ---
      LANGFUSE_INIT_ORG_ID: tbmm
      LANGFUSE_INIT_ORG_NAME: TBMM
      LANGFUSE_INIT_PROJECT_ID: rag-poc
      LANGFUSE_INIT_PROJECT_NAME: RAG-poc
      LANGFUSE_INIT_PROJECT_RETENTION: "90"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: yazilim.ai@tbmm.gov.tr
      LANGFUSE_INIT_USER_NAME: TBMM AI
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 1536m
    memswap_limit: 1536m
    environment: *langfuse-env

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.5
    restart: unless-stopped
    user: "101:101"
    mem_limit: 3584m
    memswap_limit: 3584m
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse/low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
      - ./clickhouse/low-mem-users.xml:/etc/clickhouse-server/users.d/low-mem.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 10s
      retries: 10

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command: >
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 192mb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 10

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
